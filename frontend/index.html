<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script>
    (function(){
      var m='light';
      try{
        var uid='anon';
        try{
          var u=localStorage.getItem('genyee_user');
          var p=u?JSON.parse(u):null;
          if(p&&p.id)uid=String(p.id);
        }catch(_){}
        var v=localStorage.getItem('GENYEE_'+uid+'_theme');
        if(v===null&&uid!=='anon')v=localStorage.getItem('GENYEE_anon_theme');
        if(v==='light'||v==='dark'||v==='system')m=v;
      }catch(_){}
      var t=m==='system'?(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;
      var meta=document.querySelector?document.querySelector('meta[name="color-scheme"]'):null;
      if(meta)meta.content=m==='system'?'light dark':t;
      document.documentElement.setAttribute('theme-mode',t);
      var bg=t==='dark'?'#181818':'#eee';
      window.__gyInitBg=bg;
      document.documentElement.style.background=bg;
      document.documentElement.style.minHeight='100%';
      document.documentElement.style.colorScheme=t;
      try{
        var w=window.runtime;
        if(w){
          if(t==='dark'){
            if(w.WindowSetDarkTheme)w.WindowSetDarkTheme();
            if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour(24,24,24,255);
          }else{
            if(w.WindowSetLightTheme)w.WindowSetLightTheme();
            if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour(238,238,238,255);
          }
        }
      }catch(_){}
    })();
    </script>
    <title>GENYEE</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="keywords" content="GENYEE, Knowledge Base, Enterprise RAG, AI Agent, Document Understanding, Semantic Search, LLM">
    <meta name="description" content="GENYEE is an LLM-powered document understanding, semantic retrieval, and agentic knowledge framework built for complex enterprise documents.">
    <link rel="icon" href="%BASE_URL%favicon.ico">
    <link rel="apple-touch-icon" sizes="120x120" href="%BASE_URL%favicon.ico">
    <style>
      html, body, #app { min-height: 100%; margin: 0; background: var(--gy-surface-page, #eee); }
      html[theme-mode="dark"], html[theme-mode="dark"] body, html[theme-mode="dark"] #app { background: var(--gy-surface-page, #181818); }
    </style>
</head>
<body>
<script>
(function(){
  try {
    if (localStorage.getItem('genyee_lite_mode') !== 'true') return;
    var saved = sessionStorage.getItem('genyee_lite_last_path');
    if (!saved || saved.indexOf('/platform/') !== 0 || saved.indexOf('/platform/organizations') === 0 || /[\u0000-\u001f\u007f\\]/.test(saved)) return;
    if (window.location.search || window.location.hash) return;
    var path = window.location.pathname;
    if (path !== '/' && path !== '/platform' && path !== '/platform/knowledge-bases') return;
    var target = saved.indexOf('#') >= 0 ? saved.slice(0, saved.indexOf('#')) : saved;
    if (!target) return;
    var current = window.location.pathname + window.location.search;
    if (target !== current) window.history.replaceState(window.history.state, '', target);
  } catch (e) {}
})();
</script>
<script src="%BASE_URL%config.js"></script>
<script src="%BASE_URL%tdesign-icons/0.4.1/fonts/index.js"></script>
<div id="app"></div>
<script>
(function(){var bg=window.__gyInitBg;if(!bg)return;if(document.body){document.body.style.background=bg;document.body.style.minHeight='100%';}var el=document.getElementById('app');if(el){el.style.background=bg;el.style.minHeight='100%';}})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
