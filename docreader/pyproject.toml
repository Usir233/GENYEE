[project]
name = "docreader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "grpcio>=1.78.0",
    "grpcio-health-checking>=1.78.0",
    "grpcio-tools>=1.78.0",
    "lxml>=6.1.0",
    "markdownify>=0.13.1",
    "markitdown[docx,pdf,xls,xlsx,pptx]>=0.1.3",
    # Page straightening before OCR. Floors are kept low enough for the
    # project's declared Python range (>=3.11); the R22 pipeline was validated
    # against recent releases (rapidocr 3.10 / onnxruntime 1.31 / numpy 2.5).
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.8",
    "opendataloader-pdf>=2.4.7",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "xlrd>=2.0.0",
    "pillow>=13.0.0",
    "playwright>=1.55.0",
    "protobuf>=6.33.5",
    "pydantic>=2.13.4",
    "pypdf>=6.21.4",
    "pypdfium2>=5.8.0",
    "python-docx>=1.2.0",
    "rapidocr>=3.0",
    "requests>=2.33.0",
    "trafilatura>=2.0.0",
    # Security floors also apply to installations that do not use uv.lock.
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "lxml-html-clean>=0.4.5",
    "pdfminer-six>=20251230",
    "setuptools>=84.1.0",
    "soupsieve>=2.9.0",
    "urllib3>=2.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["..", "."]
filterwarnings = [
    "ignore::bs4.XMLParsedAsHTMLWarning",
]
