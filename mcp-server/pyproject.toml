[build-system]
requires = ["setuptools>=84.1.0", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "genyee-mcp"
version = "1.1.1"
description = "GENYEE MCP Server - Model Context Protocol server for GENYEE API"
readme = "README.md"
license = "LicenseRef-GENYEE-Commercial AND MIT"
license-files = ["LICENSE", "LICENSE.GENYEE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "GENYEE Team", email = "support@genyee.com"}
]
maintainers = [
    {name = "GENYEE Team", email = "support@genyee.com"}
]
keywords = ["mcp", "model-context-protocol", "genyee", "knowledge-management", "api-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "requests>=2.34.2",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
    # Keep transitive security fixes when installing without uv.lock.
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "httpx2>=2.12.0",
    "opentelemetry-api>=1.45.1",
    "pyjwt>=2.15.0",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/Usir233/GENYEE"
Documentation = "https://github.com/Usir233/GENYEE/tree/main/website-docs"
Repository = "https://github.com/Usir233/GENYEE/tree/main/mcp-server"
"Bug Reports" = "https://github.com/Usir233/GENYEE/issues"
Changelog = "https://github.com/Usir233/GENYEE/blob/main/mcp-server/CHANGELOG.md"

[project.scripts]
genyee-mcp-server = "main:run"
weknora-mcp-server = "main:run"
genyee-server = "run_server:main"
weknora-server = "run_server:main"

[tool.setuptools]
py-modules = ["weknora_mcp_server", "upload_paths", "main", "run_server", "run", "test_module"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yml", "*.yaml"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["."]
asyncio_mode = "auto"
