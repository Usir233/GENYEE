Routes /api to backend, / to frontend.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "weknora.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "ingress" "context" .) | nindent 4 }}
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if and (not .Values.frontend.enabled) (not (hasKey $annotations "nginx.ingress.kubernetes.io/server-snippet")) }}
    {{- $_ := set $annotations "nginx.ingress.kubernetes.io/server-snippet" "location ^~ /api/v1/local-browser/internal {\n  return 404;\n}\n" }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- if .Values.ingress.tls.secretName }}
      secretName: {{ .Values.ingress.tls.secretName }}
      {{- end }}
  {{- end }}
  {{- $routeApiViaFrontend := true }}
  {{- if hasKey .Values.ingress "routeApiViaFrontend" }}
    {{- $routeApiViaFrontend = .Values.ingress.routeApiViaFrontend }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.frontend.enabled }}
          # Block internal cluster-only BrowserSkill endpoints at the gateway edge (404 via frontend nginx)
          - path: /api/v1/local-browser/internal
            pathType: Prefix
            backend:
              service:
                name: {{ include "weknora.serviceName" (dict "component" "frontend" "context" .) | quote }}
                port:
                  name: http
          {{- end }}
          {{- if or (not .Values.frontend.enabled) (not $routeApiViaFrontend) }}
          # Direct API routes when frontend gateway routing is disabled
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "weknora.serviceName" (dict "component" "app" "context" .) | quote }}
                port:
                  name: http
          {{- else }}
          # API routes forwarded through frontend Nginx gateway for upload limits & log redaction
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "weknora.serviceName" (dict "component" "frontend" "context" .) | quote }}
                port:
                  name: http
          {{- end }}
          {{- if .Values.frontend.enabled }}
          # Frontend routes - catch-all
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "weknora.serviceName" (dict "component" "frontend" "context" .) | quote }}
                port:
                  name: http
          {{- end }}
{{- end }}
