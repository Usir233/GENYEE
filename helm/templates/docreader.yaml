{{- if .Values.docreader.enabled }}
{{- $docreaderPort := int (.Values.docreader.service.port | default 50051) }}
{{- $tlsEnabled := and .Values.docreader.tls .Values.docreader.tls.enabled }}
{{- $tlsSecretName := "" }}
{{- if $tlsEnabled }}
{{- $tlsSecretName = include "genyee.docreader.tlsSecretName" . }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "genyee.fullname" . }}-docreader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "genyee.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.docreader.replicaCount }}
  selector:
    matchLabels:
      {{- include "genyee.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "genyee.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 8 }}
    spec:
      {{- include "genyee.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "genyee.serviceAccountName" . | quote }}
      {{- with .Values.docreader.podSecurityContext | default .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: docreader
          image: {{ include "genyee.docreader.image" . }}
          imagePullPolicy: {{ .Values.docreader.image.pullPolicy }}
          {{- with .Values.docreader.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ $docreaderPort }}
              name: grpc
              protocol: TCP
          env:
            - name: STORAGE_TYPE
              value: {{ .Values.docreader.env.STORAGE_TYPE | quote }}
            - name: MAX_FILE_SIZE_MB
              value: {{ .Values.global.maxFileSizeMB | quote }}
            - name: DOCREADER_GRPC_PORT
              value: {{ $docreaderPort | quote }}
            - name: GRPC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "genyee.secretName" . | quote }}
                  key: GRPC_AUTH_TOKEN
            {{- if $tlsEnabled }}
            - name: GRPC_TLS_ENABLED
              value: "true"
            - name: GRPC_TLS_CERT
              value: "/etc/docreader-tls/tls.crt"
            - name: GRPC_TLS_KEY
              value: "/etc/docreader-tls/tls.key"
            {{- end }}
          {{- if $tlsEnabled }}
          volumeMounts:
            - name: docreader-tls
              mountPath: /etc/docreader-tls
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.docreader.resources | nindent 12 }}
          # gRPC health check using grpc_health_probe
          livenessProbe:
            exec:
              command:
                - grpc_health_probe
                - {{ printf "-addr=localhost:%d" $docreaderPort | quote }}
                {{- if $tlsEnabled }}
                - -tls
                {{- if .Values.docreader.tls.caProvided }}
                - {{ printf "-tls-ca-cert=/etc/docreader-tls/%s" (include "genyee.docreader.tlsCAKey" .) | quote }}
                {{- end }}
                {{- if .Values.docreader.tls.serverName }}
                - {{ printf "-tls-server-name=%s" .Values.docreader.tls.serverName | quote }}
                {{- end }}
                {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - grpc_health_probe
                - {{ printf "-addr=localhost:%d" $docreaderPort | quote }}
                {{- if $tlsEnabled }}
                - -tls
                {{- if .Values.docreader.tls.caProvided }}
                - {{ printf "-tls-ca-cert=/etc/docreader-tls/%s" (include "genyee.docreader.tlsCAKey" .) | quote }}
                {{- end }}
                {{- if .Values.docreader.tls.serverName }}
                - {{ printf "-tls-server-name=%s" .Values.docreader.tls.serverName | quote }}
                {{- end }}
                {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      {{- if $tlsEnabled }}
      volumes:
        - name: docreader-tls
          secret:
            secretName: {{ $tlsSecretName | quote }}
      {{- end }}
      {{- with .Values.docreader.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.docreader.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.docreader.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "genyee.serviceName" (dict "component" "docreader" "context" .) | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "genyee.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.docreader.service.type }}
  selector:
    {{- include "genyee.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.docreader.service.port }}
      targetPort: grpc
      protocol: TCP
{{- end }}
