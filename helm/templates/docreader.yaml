{{- if .Values.docreader.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weknora.fullname" . }}-docreader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.docreader.replicaCount }}
  selector:
    matchLabels:
      {{- include "weknora.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "weknora.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 8 }}
    spec:
      {{- include "weknora.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "weknora.serviceAccountName" . }}
      {{- with .Values.docreader.podSecurityContext | default .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: docreader
          image: {{ include "weknora.docreader.image" . }}
          imagePullPolicy: {{ .Values.docreader.image.pullPolicy }}
          {{- with .Values.docreader.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          env:
            - name: STORAGE_TYPE
              value: {{ .Values.docreader.env.STORAGE_TYPE | quote }}
            - name: MAX_FILE_SIZE_MB
              value: {{ .Values.global.maxFileSizeMB | quote }}
            - name: GRPC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "weknora.secretName" . }}
                  key: GRPC_AUTH_TOKEN
            {{- if and .Values.docreader.tls .Values.docreader.tls.enabled }}
            - name: GRPC_TLS_ENABLED
              value: "true"
            - name: GRPC_TLS_CERT
              value: "/etc/docreader-tls/tls.crt"
            - name: GRPC_TLS_KEY
              value: "/etc/docreader-tls/tls.key"
            {{- end }}
          {{- if and .Values.docreader.tls .Values.docreader.tls.enabled .Values.docreader.tls.secretName }}
          volumeMounts:
            - name: docreader-tls
              mountPath: /etc/docreader-tls
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.docreader.resources | nindent 12 }}
          # gRPC health check using grpc_health_probe
          livenessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=localhost:50051
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - grpc_health_probe
                - -addr=localhost:50051
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      {{- if and .Values.docreader.tls .Values.docreader.tls.enabled .Values.docreader.tls.secretName }}
      volumes:
        - name: docreader-tls
          secret:
            secretName: {{ .Values.docreader.tls.secretName | quote }}
      {{- end }}
      {{- with .Values.docreader.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.docreader.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.docreader.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "weknora.serviceName" (dict "component" "docreader" "context" .) | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "weknora.componentLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.docreader.service.type }}
  selector:
    {{- include "weknora.componentSelectorLabels" (dict "component" "docreader" "context" .) | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.docreader.service.port }}
      targetPort: grpc
      protocol: TCP
{{- end }}
