[project]
name = "genyee-odl-hybrid-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opendataloader-pdf[hybrid]==2.4.7",
    "pillow>=13.0.0",
    "certifi>=2026.10.18",
    "urllib3>=2.8.0",
    # This image runs Docling on CPU. Avoid proprietary CUDA redistributables.
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true
