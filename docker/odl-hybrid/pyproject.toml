[project]
name = "genyee-odl-hybrid-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opendataloader-pdf[hybrid]==2.4.7",
    "pillow>=13.0.0",
    "certifi>=2026.10.18",
    "urllib3>=2.8.0",
    # This image runs Docling on CPU. Avoid proprietary CUDA redistributables.
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
