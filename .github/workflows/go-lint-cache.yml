name: Go Lint Cache

# Warms default-branch golangci-lint and Go build caches across all five Go
# modules on `main` when `.golangci.yml` changes or on manual dispatch.
# Per ENGINEERING_STANDARDS.md §3 (v3 zero-backlog state), full-module lint
# findings are blocking here too — zero issues are permitted across any module.

on:
  push:
    branches: [main]
    paths:
      - ".golangci.yml"
      - ".github/workflows/go-lint-cache.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOPROXY: https://proxy.golang.org,direct

jobs:
  warm-cache:
    name: warm lint cache (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [".", "cli", "client", "third_party/anydoc-go", "docs/poc/docker-sandbox"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          only-new-issues: false
          args: --config=${{ github.workspace }}/.golangci.yml --timeout=10m
