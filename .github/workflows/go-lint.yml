name: Go Lint

# Permanent v3 zero-backlog static analysis gate (see ENGINEERING_STANDARDS.md §3).
# Every Go module in the repository (`.`, `cli`, `client`, `third_party/anydoc-go`,
# and `docs/poc/docker-sandbox`) maintains zero golangci-lint findings across 100%
# of tracked files — incremental diff exemptions are prohibited on both `main`
# pushes and pull requests.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".golangci.yml"
      - ".github/workflows/go-lint.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".golangci.yml"
      - ".github/workflows/go-lint.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOPROXY: https://proxy.golang.org,direct

jobs:
  # Detect which Go modules the push or PR touches so isolated changes only
  # schedule runners for affected modules, while linting 100% of every selected
  # module with zero exemptions. Modifying `.golangci.yml`, this workflow, or
  # dispatching manually lints all five Go modules.
  changes:
    name: detect lint modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Detect changed modules
        id: detect
        shell: bash
        run: |
          all_modules=("." "cli" "client" "third_party/anydoc-go" "docs/poc/docker-sandbox")
          modules=()

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            modules=("${all_modules[@]}")
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                diff_range=""
              else
                diff_range="${base}..${GITHUB_SHA}"
              fi
            fi

            if [ -z "$diff_range" ] || git diff --name-only "$diff_range" -- \
                 .golangci.yml .github/workflows/go-lint.yml | grep -q .; then
              modules=("${all_modules[@]}")
            else
              if git diff --name-only "$diff_range" -- \
                   '*.go' \
                   ':!cli/**' \
                   ':!client/**' \
                   ':!third_party/anydoc-go/**' \
                   ':!docs/poc/docker-sandbox/**' \
                   go.mod go.sum | grep -q .; then
                modules+=(".")
              fi
              if git diff --name-only "$diff_range" -- 'cli/**' | grep -q .; then
                modules+=("cli")
              fi
              if git diff --name-only "$diff_range" -- 'client/**' | grep -q .; then
                modules+=("client")
              fi
              if git diff --name-only "$diff_range" -- 'third_party/anydoc-go/**' | grep -q .; then
                modules+=("third_party/anydoc-go")
              fi
              if git diff --name-only "$diff_range" -- 'docs/poc/docker-sandbox/**' | grep -q .; then
                modules+=("docs/poc/docker-sandbox")
              fi
            fi
          fi

          json="["
          first=1
          for m in "${modules[@]}"; do
            if [ "$first" -eq 1 ]; then
              first=0
            else
              json+=","
            fi
            json+="\"${m}\""
          done
          json+="]"
          echo "modules=${json}" >> "$GITHUB_OUTPUT"
          echo "Lint modules: ${json}"

  golangci:
    name: golangci-lint (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          only-new-issues: false
          args: --config=${{ github.workspace }}/.golangci.yml --timeout=10m
