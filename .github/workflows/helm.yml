name: Helm

on:
  push:
    branches:
      - main
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0

      - name: Lint chart
        run: helm lint ./helm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify App rollout and storage examples
        run: |
          python -m pip install PyYAML
          python -m unittest discover -s helm/tests -v

      - name: Verify application image tags
        shell: bash
        run: |
          set -euo pipefail

          render_image() {
            local template="$1"
            shift
            helm template genyee ./helm \
              --show-only "$template" \
              --set secrets.dbPassword=test \
              --set secrets.redisPassword=test \
              --set secrets.jwtSecret=test \
              "$@" \
              | awk '$1 == "image:" { print $2; exit }'
          }

          app_image="$(render_image templates/app.yaml)"
          frontend_image="$(render_image templates/frontend.yaml)"
          docreader_image="$(render_image templates/docreader.yaml)"
          app_tag="${app_image##*:}"

          test "${frontend_image##*:}" = "$app_tag"
          test "${docreader_image##*:}" = "$app_tag"

          frontend_override="$(render_image templates/frontend.yaml --set frontend.image.tag=ui-test)"
          docreader_override="$(render_image templates/docreader.yaml --set docreader.image.tag=reader-test)"

          test "$frontend_override" = "genyee/genyee-ui:ui-test"
          test "$docreader_override" = "genyee/genyee-docreader:reader-test"
