name: DocReader

on:
  push:
    branches: [main]
    paths:
      - "docreader/**"
      - "go.mod"
      - "go.sum"
      - "testdata/**"
      - "docker/Dockerfile.docreader"
      - "docker/Dockerfile.odl-hybrid"
      - ".github/workflows/docreader.yml"
  pull_request:
    paths:
      - "docreader/**"
      - "go.mod"
      - "go.sum"
      - "testdata/**"
      - "docker/Dockerfile.docreader"
      - "docker/Dockerfile.odl-hybrid"
      - ".github/workflows/docreader.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.16"
  GO_VERSION: "1.27.3"
  GOPROXY: https://proxy.golang.org,direct

jobs:
  verify:
    name: Python tests and Go client tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: docreader/uv.lock

      - name: Install Python dependencies
        run: uv sync --project docreader --locked --no-dev --python "$PYTHON_VERSION"

      - name: Compile Python sources
        run: uv run --project docreader --python "$PYTHON_VERSION" python -m compileall -q docreader

      # Both the Python proxy integration tests and Go TestReadURL launch
      # WebKit, so install the browser and system libraries before either suite.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('docreader/uv.lock') }}

      - name: Install Playwright WebKit
        run: uv run --project docreader --python "$PYTHON_VERSION" python -m playwright install --with-deps webkit

      - name: Run Python tests
        # Collect both unittest classes and pytest function regressions.
        run: uv run --project docreader --python "$PYTHON_VERSION" --with pytest python -m pytest docreader/tests -v

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Start DocReader gRPC server
        run: |
          token="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::${token}"
          echo "GRPC_AUTH_TOKEN=${token}" >> "$GITHUB_ENV"
          GRPC_AUTH_TOKEN="${token}" uv run --project docreader --python "$PYTHON_VERSION" python -m docreader.main &
          pid=$!
          echo "$pid" > "${RUNNER_TEMP}/docreader.pid"
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "DocReader gRPC server exited prematurely"
              wait "$pid" || true
              exit 1
            fi
            if nc -z 127.0.0.1 50051 2>/dev/null; then
              echo "DocReader gRPC server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "DocReader gRPC server failed to start"
          exit 1

      - name: Run Go client tests
        run: go test ./docreader/client ./docreader/proto

      - name: Stop DocReader gRPC server
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/docreader.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/docreader.pid")" 2>/dev/null || true
          fi
