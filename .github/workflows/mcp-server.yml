name: Build & Publish (mcp-server)

# Lint, type-check, test, and build the Python MCP server (`mcp-server/`) on
# `main` pushes, pull requests, and manual dispatch.
# Publishing uses PyPI Trusted Publishing (OIDC) and stays explicitly disabled
# (`if: false`) until authorized by a dedicated release decision.

on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-server.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-server.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Lint, type-check, and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.18", "3.12.16"]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.13.0"

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (test extras)
        run: uv sync --locked --python '${{ steps.python.outputs.python-path }}' --extra test

      - name: Lint and format check (ruff)
        run: |
          uv run --frozen --python '${{ steps.python.outputs.python-path }}' --with ruff ruff check --no-cache .
          uv run --frozen --python '${{ steps.python.outputs.python-path }}' --with ruff ruff format --check --no-cache .

      - name: Type-check (mypy)
        run: |
          uv run --frozen --python '${{ steps.python.outputs.python-path }}' --with mypy \
            mypy --ignore-missing-imports --no-incremental --cache-dir=/dev/null .

      - name: Run tests
        # Include both unittest cases and pytest functions (auth/CLI regressions).
        run: uv run --frozen --python '${{ steps.python.outputs.python-path }}' python -m pytest -p no:cacheprovider

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.13.0"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.16"

      - name: Build package
        run: uv build --python python

      - name: Verify wheel contains upload_paths.py (regression guard)
        run: |
          set -e
          if ! python3 -c "import glob, zipfile, sys; whl=glob.glob('dist/*.whl')[0]; z=zipfile.ZipFile(whl); sys.exit(0 if 'upload_paths.py' in z.namelist() else 1)"; then
            echo "::error::upload_paths.py is missing from the wheel — check py-modules in pyproject.toml/setup.py"
            exit 1
          fi
          echo "upload_paths.py present in wheel ✓"

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: mcp-server/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: false
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/genyee-mcp/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check if version is already published
        id: check_pypi
        working-directory: mcp-server
        # Read the version from pyproject.toml and query PyPI. If that exact
        # version already exists, skip publishing (so re-runs on an unchanged
        # version stay green instead of failing with "File already exists").
        run: |
          set -e
          project="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["name"])')"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "packaged version: $version"
          exists="$(python3 -c '
          import json, sys, urllib.request
          from urllib.error import HTTPError
          from urllib.parse import quote
          name, v = sys.argv[1:]
          try:
              d = json.load(urllib.request.urlopen("https://pypi.org/pypi/" + quote(name, safe="") + "/json", timeout=30))
              print("true" if v in d.get("releases", {}) else "false")
          except HTTPError as error:
              if error.code != 404:
                  raise
              # A brand-new package has no release metadata yet.
              print("false")
          ' "$project" "$version")"
          echo "already on PyPI: $exists"
          if [ "$exists" = "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$project $version is already on PyPI; skipping publish. Bump pyproject.toml (and synced version strings) to release new changes."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        if: steps.check_pypi.outputs.should_publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        if: steps.check_pypi.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
