name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/build_frontend_dist.sh"
      - "scripts/test_embed_nginx.py"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/build_frontend_dist.sh"
      - "scripts/test_embed_nginx.py"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Lint, test, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund

      # Install ESLint v9 and Vue/TypeScript flat-config plugins in an isolated
      # /tmp/fe-lint prefix so frontend/package.json and package-lock.json (and
      # distributed npm license bundles) remain untouched.
      - name: Lint (isolated ESLint v9)
        shell: bash
        run: |
          rm -rf /tmp/fe-lint
          trap 'rm -rf /tmp/fe-lint' EXIT
          mkdir -p /tmp/fe-lint
          cat > /tmp/fe-lint/package.json <<'EOF'
          {
            "name": "genyee-ci-fe-lint",
            "private": true,
            "type": "module"
          }
          EOF
          npm --prefix /tmp/fe-lint install --no-save --no-audit --no-fund \
            "eslint@^9" \
            "@eslint/js@^9" \
            "typescript-eslint@^8" \
            "eslint-plugin-vue@^10" \
            "vue-eslint-parser@^10" \
            "globals@^17"
          cat > /tmp/fe-lint/loader-hooks.mjs <<'EOF'
          const FALLBACK_PARENT_URL = 'file:///tmp/fe-lint/package.json';
          export async function resolve(specifier, context, nextResolve) {
            try {
              return await nextResolve(specifier, context);
            } catch (err) {
              if (
                err &&
                err.code === 'ERR_MODULE_NOT_FOUND' &&
                !specifier.startsWith('.') &&
                !specifier.startsWith('/') &&
                !specifier.startsWith('file:') &&
                !specifier.startsWith('node:') &&
                !specifier.startsWith('data:')
              ) {
                return nextResolve(specifier, {
                  ...context,
                  parentURL: FALLBACK_PARENT_URL,
                });
              }
              throw err;
            }
          }
          EOF
          cat > /tmp/fe-lint/register-loader.mjs <<'EOF'
          import { register } from 'node:module';
          register('./loader-hooks.mjs', import.meta.url);
          EOF
          NODE_PATH="/tmp/fe-lint/node_modules" \
          NODE_OPTIONS="--import /tmp/fe-lint/register-loader.mjs" \
          PATH="/tmp/fe-lint/node_modules/.bin:$PATH" \
            eslint -c eslint.config.mjs --max-warnings=0 .

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  docker-image:
    name: Docker multi-stage image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build UI image
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_FRONTEND_COMMIT="${GITHUB_SHA::7}" \
            -t genyee-ui:ci \
            frontend/

      - name: Test embed and MCP proxy routes
        run: python3 scripts/test_embed_nginx.py genyee-ui:ci
