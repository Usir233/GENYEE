name: App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so a
# migrations-only or unrelated Go PR does not compile the parser engine.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/*.sh"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "docs/**"
      - "!docs/poc/**"
      - "migrations/**"
      - "skills/preloaded/**"
      - "testdata/**"
      - "website-docs/0*/**"
      - "website-docs/.vitepress/config.mts"
      - "docker/Dockerfile.app"
      - "scripts/docker-entrypoint.sh"
      - "scripts/docker-entrypoint_test.sh"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "internal/models/catalog/data/**"
      - "internal/models/parity/testdata/**"
      - "internal/models/providers/assets/**"
      - "scripts/model-catalog/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.sh"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "docs/**"
      - "!docs/poc/**"
      - "migrations/**"
      - "skills/preloaded/**"
      - "testdata/**"
      - "website-docs/0*/**"
      - "website-docs/.vitepress/config.mts"
      - "docker/Dockerfile.app"
      - "scripts/docker-entrypoint.sh"
      - "scripts/docker-entrypoint_test.sh"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "internal/models/catalog/data/**"
      - "internal/models/parity/testdata/**"
      - "internal/models/providers/assets/**"
      - "scripts/model-catalog/**"
      - "scripts/*license*.sh"
      - "scripts/git-hooks/**"
      - "scripts/test-git-hooks.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  GENYEE_LOG_FORMAT: ""

jobs:
  verify:
    name: Format, shellcheck, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Download modules
        run: go mod download

      - name: Test Docker entrypoint permissions
        run: bash scripts/docker-entrypoint_test.sh

      - name: Verify third-party notices and source bundle
        run: |
          bash ./scripts/check-license-bundle.sh
          bash ./scripts/test-license-bundle.sh

      - name: Check Go formatting (all tracked .go files)
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "The following tracked Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint shell scripts (shellcheck)
        shell: bash
        run: |
          git ls-files -z '*.sh' scripts/git-hooks/pre-commit scripts/git-hooks/pre-push |
            xargs -0 -r shellcheck

      - name: Verify generated model catalog
        run: python3 scripts/model-catalog/generate.py --check

      - name: Verify Git hook test coverage
        run: bash ./scripts/test-git-hooks.sh

      - name: Verify Clean Architecture and OpenAPI contracts
        run: go test -count=1 ./internal ./docs/...

      - name: Vet and test
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')
          go vet "${pkgs[@]}"
          go test "${pkgs[@]}"
          go test -tags desktop ./internal/container

      - name: Build server
        run: go build ./cmd/server
