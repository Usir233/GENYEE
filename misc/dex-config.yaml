# Local development Dex OIDC configuration (bound to 127.0.0.1:5556 by Compose).
# Set OIDC_AUTH_CLIENT_SECRET in .env before starting `--profile dex`.
issuer: http://127.0.0.1:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
staticClients:
  - id: genyee
    redirectURIs:
      - 'http://127.0.0.1:5173/api/v1/auth/oidc/callback'
      - 'http://127.0.0.1/api/v1/auth/oidc/callback'
    name: 'GENYEE'
    secretEnv: DEX_CLIENT_SECRET
enablePasswordDB: false
oauth2:
  responseTypes:
    - code
  skipApprovalScreen: false
